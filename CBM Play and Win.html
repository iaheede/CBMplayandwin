<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBM Play & Win</title>
    <style>
        :root {
            --primary: #4a00e0;
            --secondary: #8e2de2;
            --dark: #1f1c2c;
            --light: #f5f5f5;
            --success: #2ed573;
            --danger: #ff4757;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #471267;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }
        .screen { display: none; }
        .active { display: block; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .option-btn { background: #34495e; color: white; text-align: left; }
        .option-btn:hover:not(:disabled) { background: #4b6584; }
        .option-btn.correct { background: var(--success) !important; }
        .option-btn.wrong { background: var(--danger) !important; }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        #timer { color: #ff4757; }
        #feedback { font-weight: bold; margin-top: 15px; min-height: 20px; }
        .success-text { color: var(--success); }
        .error-text { color: var(--danger); }
        ol { text-align: left; padding-left: 20px; }
        li { margin: 8px 0; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="screen active">
        <h2>CBM Play & Win</h2>
        <p>Answer 20 questions in 60 seconds!</p>
        <input type="text" id="username" placeholder="Enter your nickname" required>
        <button onclick="startGame()">Start Game</button>
        <button onclick="showLeaderboard()" style="background: #57606f; margin-top: 5px;">View Online High Scores</button>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="game-screen" class="screen">
        <div class="stats-bar">
            <div>Score: <span id="score">0</span></div>
            <div>Q: <span id="q-num">1</span>/20</div>
            <div>Time: <span id="timer">60</span>s</div>
        </div>
        <h3 id="question-text">Question Placeholder</h3>
        <div class="options-grid" id="options-container"></div>
        <div id="feedback"></div>
    </div>

    <!-- SCREEN 3: GAME OVER / LEADERBOARD -->
    <div id="leaderboard-screen" class="screen">
        <h2>Game Over!</h2>
        <h3 id="final-status"></h3>
        <p>Your Score: <span id="final-score">0</span>/400</p>
        <p>Correct Answers: <span id="final-correct">0</span>/20</p>
        <p>Accuracy: <span id="final-accuracy">0</span>%</p>
        <hr>
        <h3>🏆 Global Online Leaderboard</h3>
        <ol id="leaderboard-list"></ol>
        <button onclick="restartGame()">Play Again</button>
    </div>
</div>

<!-- Include the Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. DATABASE CONFIGURATION
    const SUPABASE_URL = "https://ojbjqiskkkdlsnodgzzu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qYmpxaXNra2tkbHNub2Rnenp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTExNjQsImV4cCI6MjA5ODQ2NzE2NH0.zI9teDoT7a8aSp2liwrKtu7q8KHano2fULqePTUqiPs";
    
    // Initialize Supabase Client
    const supabase = typeof window !== 'undefined' && window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    const STORAGE_KEY = 'cbm-play-and-win-leaderboard';

    function getStoredScores() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        } catch {
            return [];
        }
    }

    function saveStoredScore(name, finalScore) {
        const scores = getStoredScores();
        scores.push({ name, score: finalScore, created_at: new Date().toISOString() });
        scores.sort((a, b) => b.score - a.score);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(scores.slice(0, 10)));
    }

    // 2. QUESTION BANK
    const questionBank = [
        { q: "What is 2 + 2?", a: ["3", "4", "5", "6"], correct: "4" },
        { q: "Capital of France?", a: ["London", "Berlin", "Paris", "Rome"], correct: "Paris" },
        { q: "Which planet is known as the Red Planet?", a: ["Earth", "Mars", "Jupiter", "Venus"], correct: "Mars" },
        { q: "What is the largest ocean?", a: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: "Pacific" },
        { q: "How many legs does a spider have?", a: ["6", "8", "10", "12"], correct: "8" },
        { q: "What is the boiling point of water?", a: ["90°C", "100°C", "120°C", "150°C"], correct: "100°C" },
        { q: "Which gas do humans breathe in?", a: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], correct: "Oxygen" }
    ];

    let gameQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let correctCount = 0;
    let timeLeft = 60;
    let timerInterval;
    let playerName = "";

    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // Shuffle helper function
    function shuffleArray(array) {
        return [...array].sort(() => 0.5 - Math.random());
    }

    function buildQuestionSet() {
        const baseQuestions = shuffleArray(questionBank);
        return Array.from({ length: 20 }, (_, index) => baseQuestions[index % baseQuestions.length]);
    }

    function startGame() {
        playerName = document.getElementById('username').value.trim();
        if (!playerName) return alert("Please enter a name!");

        if (timerInterval) clearInterval(timerInterval);

        score = 0;
        correctCount = 0;
        timeLeft = 60;
        currentQuestionIndex = 0;
        gameQuestions = buildQuestionSet();

        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = '';

        changeScreen('game-screen');
        showQuestion();

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame(false);
        }, 1000);
    }

    function showQuestion() {
        if (currentQuestionIndex >= gameQuestions.length) {
            endGame(true);
            return;
        }
        const currentQ = gameQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQ.q;
        document.getElementById('q-num').innerText = currentQuestionIndex + 1;
        document.getElementById('feedback').innerText = '';
        
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        
        currentQ.a.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.dataset.answer = option;
            btn.innerText = `${index + 1}. ${option}`;
            btn.onclick = () => checkAnswer(btn, option, currentQ.correct);
            container.appendChild(btn);
        });
    }

    function showFeedback(text, type) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.className = type === 'success' ? 'success-text' : 'error-text';
    }

    function checkAnswer(button, selected, correct) {
        const buttons = document.querySelectorAll('#options-container button');
        buttons.forEach(btn => btn.disabled = true);

        if (selected === correct) {
            score += 20;
            correctCount += 1;
            document.getElementById('score').innerText = score;
            button.classList.add('correct');
            showFeedback('Correct!', 'success');
        } else {
            button.classList.add('wrong');
            buttons.forEach(btn => {
                if (btn.dataset.answer === correct) {
                    btn.classList.add('correct');
                }
            });
            showFeedback('Incorrect', 'error');
        }

        setTimeout(() => {
            currentQuestionIndex++;
            showQuestion();
        }, 600);
    }

    async function endGame(completed) {
        clearInterval(timerInterval);
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-correct').innerText = correctCount;
        
        const totalQs = gameQuestions.length > 0 ? gameQuestions.length : 1;
        const accuracy = Math.round((correctCount / totalQs) * 100);
        document.getElementById('final-accuracy').innerText = accuracy;
        
        if (!completed) {
            document.getElementById('final-status').innerText = "Oh no! You are out of time. Try again next time!";
        } else if (score === (gameQuestions.length * 20)) {
            document.getElementById('final-status').innerText = "Congratulations! You have answered all the questions. Screenshot and show this to one of our team members to collect the prize.";
        } else {
            document.getElementById('final-status').innerText = "You finished the quiz! Try again to improve your score.";
        }

        // Save score to online Supabase database
        await saveScoreToCloud(playerName, score);
        // Pull latest online high scores
        showLeaderboard();
    }

    // --- ONLINE DATABASE FUNCTIONS ---
    async function saveScoreToCloud(name, finalScore) {
        saveStoredScore(name, finalScore);

        if (!supabase) {
            return;
        }

        try {
            const { error } = await supabase
                .from('leaderboard')
                .insert([{ name: name, score: finalScore }]);
            if (error) throw error;
        } catch (err) {
            console.error("Error saving score:", err.message);
        }
    }

    async function showLeaderboard() {
        changeScreen('leaderboard-screen');
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = "<li>Loading scores...</li>";

        const localScores = getStoredScores();

        if (!supabase) {
            list.innerHTML = "";
            if (!localScores.length) {
                list.innerHTML = "<li>No high scores yet!</li>";
                return;
            }

            localScores.forEach(entry => {
                const li = document.createElement('li');
                const date = entry.created_at ? new Date(entry.created_at).toLocaleDateString() : new Date().toLocaleDateString();
                li.innerHTML = `<strong>${entry.name}</strong> - ${entry.score} pts (${date})`;
                list.appendChild(li);
            });
            return;
        }

        try {
            const { data, error } = await supabase
                .from('leaderboard')
                .select('*')
                .order('score', { ascending: false })
                .limit(10);

            if (error) throw error;

            list.innerHTML = "";
            const combinedScores = [...localScores, ...(data || [])];
            combinedScores.sort((a, b) => b.score - a.score);

            if (!combinedScores.length) {
                list.innerHTML = "<li>No high scores yet!</li>";
                return;
            }

            combinedScores.slice(0, 10).forEach(entry => {
                const li = document.createElement('li');
                const date = entry.created_at ? new Date(entry.created_at).toLocaleDateString() : new Date().toLocaleDateString();
                li.innerHTML = `<strong>${entry.name}</strong> - ${entry.score} pts (${date})`;
                list.appendChild(li);
            });
        } catch (err) {
            list.innerHTML = "<li>Error loading leaderboard.</li>";
            console.error("Error fetching leaderboard:", err.message);
        }
    }

    function restartGame() {
        changeScreen('login-screen');
    }
</script>
</body>
</html>
