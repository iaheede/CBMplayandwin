<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Trivia Challenge</title>
    <style>
        :root {
            --primary: #4a00e0;
            --secondary: #8e2de2;
            --dark: #1f1c2c;
            --light: #f5f5f5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, var(--dark), #928dab);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .screen { display: none; }
        .active { display: block; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        input { box-sizing: border-box; }
        button {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .option-btn { background: #34495e; }
        .option-btn:hover { background: #4b6584; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        #timer { color: #ff4757; }
        ol { text-align: left; padding-left: 20px; }
        li { margin: 8px 0; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="screen active">
        <h2>Speed Trivia Challenge</h2>
        <p>Answer 20 questions in 60 seconds!</p>
        <input type="text" id="username" placeholder="Enter your nickname" required>
        <button onclick="startGame()">Start Game</button>
        <button onclick="showLeaderboard()" style="background: #57606f; margin-top: 5px;">View High Scores</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="stats-bar">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="timer">60</span>s</div>
        </div>
        <h3 id="question-text">Question Placeholder</h3>
        <div class="options-grid" id="options-container">
            </div>
    </div>

    <div id="leaderboard-screen" class="screen">
        <h2>Game Over!</h2>
        <h3 id="final-status"></h3>
        <p>Your Score: <span id="final-score">0</span>/400</p>
        <hr>
        <h3>🏆 High Scores</h3>
        <ol id="leaderboard-list"></ol>
        <button onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
    // --- CUSTOMIZABLE BACKEND QUESTIONS ---
    // You can easily add, remove, or change questions here.
    const questionBank = [
        { q: "What is 2 + 2?", a: ["3", "4", "5", "6"], correct: "4" },
        { q: "Capital of France?", a: ["London", "Berlin", "Paris", "Rome"], correct: "Paris" },
        { q: "Which planet is known as the Red Planet?", a: ["Earth", "Mars", "Jupiter", "Venus"], correct: "Mars" },
        { q: "What is the largest ocean?", a: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: "Pacific" },
        { q: "How many legs does a spider have?", a: ["6", "8", "10", "12"], correct: "8" },
        // Add 15 more questions below following this exact template to reach 20 total
        { q: "What is the boiling point of water?", a: ["90°C", "100°C", "120°C", "150°C"], correct: "100°C" },
        { q: "Which gas do humans breathe in?", a: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], correct: "Oxygen" }
    ];

    // Select exactly 20 questions (or less if your bank is small)
    let gameQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timeLeft = 60;
    let timerInterval;
    let playerName = "";

    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
        playerName = document.getElementById('username').value.trim();
        if (!playerName) return alert("Please enter a name!");
        
        // Setup game variables
        score = 0;
        timeLeft = 60;
        currentQuestionIndex = 0;
        // Shuffle and pick up to 20 questions
        gameQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 20);
        
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        
        changeScreen('game-screen');
        showQuestion();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame(false); // Lost due to time
            }
        }, 1000);
    }

    function showQuestion() {
        if (currentQuestionIndex >= gameQuestions.length) {
            endGame(true); // Won! Answered all questions
            return;
        }

        const currentQ = gameQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQ.q;
        
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        
        currentQ.a.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(option, currentQ.correct);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct) {
        if (selected === correct) {
            score += 20;
            document.getElementById('score').innerText = score;
        }
        currentQuestionIndex++;
        showQuestion();
    }

    function endGame(completed) {
        clearInterval(timerInterval);
        document.getElementById('final-score').innerText = score;
        
        if (completed && score === (gameQuestions.length * 20)) {
            document.getElementById('final-status').innerText = "🎉 Perfection! You beat the clock!";
        } else {
            document.getElementById('final-status').innerText = "⏰ Time's up or missed a few!";
        }

        saveScore(playerName, score);
        showLeaderboard();
    }

    // --- SCORE MANAGEMENT USING LOCALSTORAGE (FREE BACKEND alternative) ---
    function saveScore(name, finalScore) {
        let history = JSON.parse(localStorage.getItem('trivia_history')) || [];
        history.push({ name: name, score: finalScore, date: new Date().toLocaleDateString() });
        history.sort((a, b) => b.score - a.score); // Sort highest first
        localStorage.setItem('trivia_history', JSON.stringify(history.slice(0, 10))); // Save top 10
    }

    function showLeaderboard() {
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = "";
        let history = JSON.parse(localStorage.getItem('trivia_history')) || [];
        
        history.forEach(entry => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${entry.name}</strong> - ${entry.score} pts (${entry.date})`;
            list.appendChild(li);
        });
        changeScreen('leaderboard-screen');
    }

    function restartGame() {
        changeScreen('login-screen');
    }
</script>
</body>
</html>
